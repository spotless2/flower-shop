<header id="header" class="fixed-top d-flex align-items-center">
  <div class="container d-flex align-items-center justify-content-between">

    <div class="logo">
      <a href=""><img src="../assets/img/logo.png" alt="" class="img-fluid"></a>
    </div>
    <nav id="navbar" class="navbar" [class.navbar-mobile]="isCollapsed">

      <ul class="navbar-nav flex-grow-1 justify-content-center flex-row">
        <li><a routerLink="/home" style="text-decoration: none;" routerLinkActive="active" ariaCurrentWhenActive="page">Acasa</a></li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            Evenimente
          </a>
          <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
            <li><a class="dropdown-item" routerLink="/digital-invitations" routerLinkActive="active" ariaCurrentWhenActive="page">Invitatii digitale</a></li>
            <li><a class="dropdown-item" routerLink="/event-packages" routerLinkActive="active" ariaCurrentWhenActive="page">Pachete evenimente</a></li>
          </ul>
        </li>
        <li><a routerLink="/flowers" style="text-decoration: none;" routerLinkActive="active" ariaCurrentWhenActive="page">Florarie</a></li>
        <li><a routerLink="/gallery" style="text-decoration: none;" routerLinkActive="active" ariaCurrentWhenActive="page">Galerie</a></li>
        <li><a routerLink="/contact" style="text-decoration: none;" routerLinkActive="active" ariaCurrentWhenActive="page">Contact</a></li>
      </ul>

      <i class="bi bi-list mobile-nav-toggle" (click)="toggleCollapse()"></i>
    </nav>

    <div class="d-flex">

      <!-- Modal for Cart Items -->
            <ng-template #cartContent let-modal>
        <div class="modal-header">
          <h4 class="modal-title" id="modal-cart">Cos</h4>
          <button type="button" class="close" aria-label="Close" (click)="modal.dismiss('Cross click')">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <ul *ngIf="cart.length > 0; else emptyCart">
            <li *ngFor="let item of cart">
              <div style="display: flex; justify-content: space-between;">
                <span>{{ item.name }}</span>
                <span>Pret: {{ item.price }} lei</span>
                <button class="btn btn-outline-danger btn-sm" (click)="removeFromCart(item)">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-x" viewBox="0 0 16 16">
                    <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"/>
                  </svg>
                </button>
              </div>
            </li>
          </ul>
          <ng-template #emptyCart>
            <p>Nu ai adaugat nimic in cos</p>
          </ng-template>
          <div *ngIf="cart.length > 0" style="display: flex; justify-content: space-between; font-weight: bold;">
            <span>Total:</span>
            <span>{{ total }} lei</span>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-success me-2" [disabled]="total === 0" (click)="proceedToCheckout()">Finalizeaza comanda</button>
          <button type="button" class="btn btn-outline btn-custom" (click)="modal.close('Close click')">Close</button>
        </div>
      </ng-template>
      <a href="https://www.instagram.com/your_account/" target="_blank" class="btn btn-outline btn-custom me-2">
        <i class="bi bi-instagram"></i>
      </a>
      <button class="btn btn-outline btn-custom position-relative" (click)="openCart(cartContent)">
        <i class="bi bi-cart"></i>
        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
            {{cartItemCount}}
            <span class="visually-hidden">unread messages</span>
        </span>
    </button>
    </div>

  </div>
</header>
